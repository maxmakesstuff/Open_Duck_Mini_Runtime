# Installed by ops/pigpio/setup-pigpio.sh (Open Duck Mini) as a systemd drop-in at
#   /etc/systemd/system/pigpiod.service.d/override.conf
#
# Runs pigpiod on the PWM clock peripheral (-t 0) instead of its default PCM clock.
# The max98357A speaker uses I2S, which is driven by the PCM peripheral; leaving
# pigpio on PCM would corrupt the I2S timing and can DAMAGE the speaker. -t 0 keeps
# the two apart so the ear-antenna hardware PWM and the speaker coexist safely.
#
# Editing the packaged pigpiod.service directly would be lost on a pigpio reinstall;
# a drop-in override survives. The first empty ExecStart= clears the packaged
# command, the second replaces it.
[Service]
ExecStart=
ExecStart=/usr/bin/pigpiod -l -t 0
