# Open Duck captive-portal DNS hijack.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/duck-captive.conf — read by
# the AP's shared-mode dnsmasq. Points ONLY the OS connectivity-check domains at
# the duck (10.42.0.1) so the probe REACHES our web server even when the duck has
# no upstream internet. The server then answers the probe with "Success", so the
# phone concludes the network is online and STAYS connected (no login sheet, no
# disconnect-on-dismiss). Every OTHER name resolves normally.
#
# (The port-80 nft redirect catches all HTTP regardless of DNS; this just makes
# sure the OS probe lands on us so we can answer it instead of the phone timing out.)
#
# Takes effect when the AP's dnsmasq (re)starts — i.e. on the next reboot, or a
# NetworkManager reapply. Change 10.42.0.1 if the AP IP differs.

address=/captive.apple.com/10.42.0.1
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/www.msftconnecttest.com/10.42.0.1
address=/msftconnecttest.com/10.42.0.1
address=/detectportal.firefox.com/10.42.0.1
address=/nmcheck.gnome.org/10.42.0.1
address=/network-test.debian.org/10.42.0.1
