# Open Duck captive-portal DNS: point AP clients at the duck.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/duck-captive.conf — read by the
# AP's shared-mode dnsmasq. The wildcard resolves EVERY name to the duck (10.42.0.1),
# so opening any http URL on the phone forwards you to the control UI (no IP to type).
# The web server answers the OS connectivity-check probes with "Success", so phones
# STAY connected (no login popup / disconnect-on-dismiss).
#
# This resolves bdxv2.local -> 10.42.0.1 too, which is STILL the duck, so SSH is
# unaffected (and .local goes over mDNS anyway). The nft redirect only touches
# tcp/80, never tcp/22.
#
# Takes effect when the AP's dnsmasq (re)starts — i.e. on the next reboot. Change
# 10.42.0.1 if the AP IP differs. To go back to resolving ONLY the probe domains,
# delete the 'address=/#/...' line below.

# --- resolve EVERYTHING to the duck (global browser auto-forward) ---
address=/#/10.42.0.1

# --- explicit OS connectivity-check domains (redundant with the wildcard above,
#     kept as documentation of what the various OSes probe) ---
address=/captive.apple.com/10.42.0.1
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/www.msftconnecttest.com/10.42.0.1
address=/msftconnecttest.com/10.42.0.1
address=/detectportal.firefox.com/10.42.0.1
address=/nmcheck.gnome.org/10.42.0.1
address=/network-test.debian.org/10.42.0.1
