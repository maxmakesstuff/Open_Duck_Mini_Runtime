<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#100E0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Open Duck Mini — Console</title>

<style>
/* ============================================================
   OPEN DUCK MINI — Amber Flight Console
   Warm amber-phosphor cockpit for a little BDX duck droid.
   Signature: live attitude-horizon that tilts with the IMU.
   ============================================================ */
:root{
  --void:#100E0A; --panel:#1B1710; --well:#241E15; --line:#3A2F1E;
  --amber:#FFB020; --amber-hot:#FF7D1A; --ink:#F2E6CC; --dim:#93856B;
  --ok:#78D18B; --alarm:#FF4B3A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --glow:0 0 0 1px rgba(255,176,32,.15),0 0 18px -4px rgba(255,140,26,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--void); color:var(--ink);
  font-family:var(--mono); font-size:15px; line-height:1.2;
  -webkit-user-select:none; user-select:none;
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(255,140,26,.10), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,176,32,.028) 0 1px, transparent 1px 3px);
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* ---------- shell ---------- */
#app{display:flex; flex-direction:column; height:100dvh; height:100vh;
     padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);
     gap:8px; max-width:560px; margin:0 auto;}
.lbl{font-size:9.5px; letter-spacing:.16em; color:var(--dim); text-transform:uppercase}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- header ---------- */
#top{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:34px}
.brand{display:flex; align-items:center; gap:8px}
.brand svg{width:30px; height:26px; color:var(--amber); filter:drop-shadow(0 0 6px rgba(255,140,26,.4))}
.brand .bt{display:flex; flex-direction:column; line-height:1}
.brand .bt b{font-family:var(--sans); font-weight:800; font-size:13.5px; letter-spacing:.02em; color:var(--ink)}
.brand .bt span{font-size:8.5px; letter-spacing:.34em; color:var(--dim); margin-top:2px}
.status{display:flex; align-items:center; gap:9px}
.conn{display:flex; align-items:center; gap:6px; font-size:10px; letter-spacing:.1em; color:var(--dim)}
.dot{width:9px; height:9px; border-radius:50%; background:#4a4038; box-shadow:0 0 0 3px rgba(120,120,120,.08)}
.conn.live .dot{background:var(--ok); box-shadow:0 0 10px var(--ok); animation:beat 1.6s ease-in-out infinite}
.conn.live b{color:var(--ok)} .conn b{color:inherit; font-weight:400}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.45}}
.pill{font-family:var(--sans); font-weight:800; font-size:11px; letter-spacing:.14em;
      padding:6px 11px; border-radius:999px; color:var(--void); background:var(--amber);
      box-shadow:var(--glow)}
.pill.head{background:var(--amber-hot)}

/* ---------- telemetry ---------- */
#tele{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:stretch;
      background:linear-gradient(180deg,var(--panel),#17130d); border:1px solid var(--line);
      border-radius:14px; padding:10px 12px}
.cell{display:flex; flex-direction:column; justify-content:center; gap:5px; min-width:0}

/* attitude indicator — the signature */
.att-cell{align-items:center; gap:6px}
.att{position:relative; width:74px; height:74px; border-radius:50%; overflow:hidden;
     border:2px solid var(--line); box-shadow:inset 0 0 14px rgba(0,0,0,.7), var(--glow)}
.att-disc{position:absolute; left:-50%; top:-50%; width:200%; height:200%;
          transform-origin:50% 50%; transition:transform .16s linear}
.att-sky{position:absolute; inset:0 0 50% 0; background:linear-gradient(#241d13,#171208)}
.att-gnd{position:absolute; inset:50% 0 0 0;
         background:linear-gradient(#8a5a12,#c4831c); border-top:1.5px solid var(--amber)}
.att-lad{position:absolute; left:50%; top:50%; width:26px; height:2px; margin-left:-13px;
         background:rgba(242,230,204,.5)}
.att-fix{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:3}
.att-fix svg{width:44px; height:16px; color:var(--ink);
             filter:drop-shadow(0 0 3px rgba(0,0,0,.9))}
.att-roll{position:absolute; top:2px; left:50%; margin-left:-4px; z-index:3;
          border-left:4px solid transparent; border-right:4px solid transparent;
          border-top:6px solid var(--ink)}
.att.fallen .att-gnd{background:linear-gradient(#7a1f14,var(--alarm)); border-top-color:#ffb3aa}
.att.fallen{border-color:var(--alarm); box-shadow:inset 0 0 16px rgba(0,0,0,.7),0 0 18px var(--alarm);
            animation:alarm .7s steps(2) infinite}
.att.stale{filter:grayscale(.6) opacity(.5)}
@keyframes alarm{50%{border-color:#7a1f14}}
.pr{display:flex; gap:10px; font-size:10.5px}
.pr b{color:var(--ink); font-weight:400}

/* battery */
.batt-cell{align-items:center; justify-content:center}
.batt{display:flex; align-items:center; gap:2px}
.batt-body{position:relative; width:74px; height:30px; border:2px solid var(--dim);
           border-radius:5px; padding:3px; overflow:hidden; background:#0d0b07}
.batt-fill{height:100%; width:0%; border-radius:2px;
           background:linear-gradient(180deg,var(--amber),var(--amber-hot));
           transition:width .4s ease, background .3s}
.batt-body.warn .batt-fill{background:linear-gradient(180deg,#ffb84d,var(--amber-hot))}
.batt-body.crit .batt-fill{background:linear-gradient(180deg,#ff7a5c,var(--alarm))}
.batt-cap{width:5px; height:13px; background:var(--dim); border-radius:0 3px 3px 0}
.bolt{position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:2}
.batt-body.chg .bolt{display:flex; animation:beat 1.3s ease-in-out infinite}
.bolt svg{width:16px; height:22px; color:var(--void); filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
.batt-txt{font-size:12px; margin-top:5px}
.batt-txt b{color:var(--ink); font-weight:400} .batt-txt .v{color:var(--amber)}

/* readouts */
.read-cell{gap:6px; text-align:right}
.read{display:flex; align-items:baseline; justify-content:flex-end; gap:6px; font-size:12px}
.read b{color:var(--ink); font-weight:400; min-width:44px; text-align:right}
.read .u{font-size:9px; color:var(--dim)}
.read .rec{color:var(--dim)}
.read .rec.on{color:var(--alarm)} .read .rec.play{color:var(--ok)}
.read.gov.warn b{color:var(--amber-hot)}

/* banner */
#banner{min-height:0; height:0; overflow:hidden; border-radius:11px; text-align:center;
        font-family:var(--sans); font-weight:800; letter-spacing:.18em; font-size:12px;
        display:flex; align-items:center; justify-content:center; transition:height .18s}
#banner.show{height:30px}
#banner.msg{background:#241E15; color:var(--dim); border:1px solid var(--line); font-family:var(--mono); font-weight:400; letter-spacing:.06em; text-transform:none}
#banner.pause{background:linear-gradient(90deg,#3a2c10,#4a3512); color:var(--amber); border:1px solid var(--amber)}
#banner.fall{background:linear-gradient(90deg,#3a120d,#5a1a12); color:#ffd9d2; border:1px solid var(--alarm); animation:alarm .7s steps(2) infinite}

/* ---------- controls ---------- */
#controls{flex:1; display:flex; flex-direction:column; gap:10px; min-height:0}
#controls.off{opacity:.4; pointer-events:none; filter:saturate(.4)}

.sticks{display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:0 0 auto}
.stick{position:relative; aspect-ratio:1/1; width:100%; max-width:180px; margin:0 auto;
       border-radius:50%; background:radial-gradient(circle at 50% 40%,#221c13,#120f0a 70%);
       border:1px solid var(--line); touch-action:none; overflow:hidden;
       box-shadow:inset 0 4px 20px rgba(0,0,0,.6)}
.stick::before{content:""; position:absolute; inset:14%; border-radius:50%;
       border:1px dashed rgba(255,176,32,.16)}
.stick .cross{position:absolute; inset:0; opacity:.5}
.stick .cross::before,.stick .cross::after{content:""; position:absolute; background:rgba(255,176,32,.12)}
.stick .cross::before{left:8%; right:8%; top:50%; height:1px}
.stick .cross::after{top:8%; bottom:8%; left:50%; width:1px}
.stick.horiz .cross::after{display:none}
.stick.horiz::before{inset:32% 14%}
.knob{position:absolute; left:50%; top:50%; width:34%; height:34%; margin:-17% 0 0 -17%;
      border-radius:50%; background:radial-gradient(circle at 40% 35%,#ffd27a,var(--amber-hot));
      box-shadow:0 0 0 2px rgba(16,14,10,.7),0 6px 16px rgba(0,0,0,.6),0 0 18px rgba(255,140,26,.5);
      transition:transform .18s cubic-bezier(.2,.9,.3,1.3); z-index:2; will-change:transform}
.stick.on .knob{transition:none; background:radial-gradient(circle at 40% 35%,#ffe0a0,var(--amber))}
.stick .cap{position:absolute; top:8px; left:0; right:0; text-align:center; z-index:3}
.stick .read{position:absolute; bottom:7px; left:0; right:0; text-align:center; font-size:9.5px;
      color:var(--amber); z-index:3; opacity:0; transition:opacity .15s}
.stick.on .read{opacity:1}

/* button pads */
.pads{display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:0 0 auto}
.pad{position:relative; display:grid; gap:6px}
.face{grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
      grid-template-areas:". y ." "x . b" ". a ."}
.dpad{grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
      grid-template-areas:". up ." "lt mid rt" ". dn ."}
.b-y{grid-area:y}.b-x{grid-area:x}.b-b{grid-area:b}.b-a{grid-area:a}
.d-up{grid-area:up}.d-lt{grid-area:lt}.d-rt{grid-area:rt}.d-dn{grid-area:dn}.d-mid{grid-area:mid}

.btn{-webkit-appearance:none; appearance:none; font-family:var(--mono); color:var(--ink);
     background:linear-gradient(180deg,var(--well),#191309); border:1px solid var(--line);
     border-radius:12px; min-height:46px; padding:4px; display:flex; flex-direction:column;
     align-items:center; justify-content:center; gap:1px; cursor:pointer; position:relative;
     box-shadow:0 2px 0 rgba(0,0,0,.5); transition:transform .07s, background .15s, box-shadow .15s}
.btn:active,.btn.press{transform:translateY(2px); box-shadow:0 0 0 rgba(0,0,0,.5)}
.btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.btn .g{font-family:var(--sans); font-weight:800; font-size:16px; line-height:1}
.btn .l{font-size:8.5px; letter-spacing:.1em; color:var(--dim)}
.btn.active{background:linear-gradient(180deg,#4a3512,#2e2109); border-color:var(--amber); color:var(--amber)}
.btn.active .l{color:var(--amber)}
.btn.disabled{opacity:.32; pointer-events:none}
.btn.down{background:linear-gradient(180deg,#5a3d10,#331f07); border-color:var(--amber-hot); transform:translateY(2px)}
.d-mid{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
       border:1px dashed var(--line); border-radius:10px}
.d-mid b{color:var(--amber); font-size:12px; font-weight:400}
.d-mid span{font-size:8px; letter-spacing:.14em; color:var(--dim)}
.btn.rec{border-color:var(--alarm); color:#ffcfc7}
.btn.rec .l{color:var(--alarm)}
.btn.play{border-color:var(--ok); color:#cdefd6}
.btn.lb{grid-column:1/-1; flex-direction:row; gap:8px; min-height:44px; font-size:12px;
        letter-spacing:.14em}
.ring{position:absolute; inset:-1px; border-radius:12px; pointer-events:none;
      background:conic-gradient(var(--alarm) calc(var(--p,0)*360deg), transparent 0);
      -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
      mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
      opacity:0; transition:opacity .1s}
.btn.holding .ring{opacity:1}

.lb-row{flex:0 0 auto; display:grid}
.lb-row .btn.lb{grid-column:auto}

/* antenna trigger sliders */
.ant{flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.slot{background:var(--well); border:1px solid var(--line); border-radius:12px; padding:7px 9px}
.slot .hd{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.slot .hd b{color:var(--amber); font-size:11px; font-weight:400}
.track{position:relative; height:16px; border-radius:8px; background:#0e0b07;
       border:1px solid var(--line); touch-action:none; overflow:hidden}
.track .fill{position:absolute; left:0; top:0; bottom:0; width:0%;
       background:linear-gradient(90deg,var(--amber-hot),var(--amber))}
.track .grip{position:absolute; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; left:0;
       border-radius:50%; background:radial-gradient(circle at 40% 35%,#ffd27a,var(--amber-hot));
       box-shadow:0 0 0 2px rgba(16,14,10,.7),0 0 12px rgba(255,140,26,.5)}
.ant.hidden{display:none}
.trim{margin-top:8px; padding:9px 11px; border:1px solid var(--line); border-radius:12px;
      background:var(--panel); display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      justify-content:center}
.trim.hidden{display:none}
.trim>.lbl{color:var(--amber)}
.trim-ax{display:flex; align-items:center; gap:7px}
.trim-ax b{font-size:15px; min-width:56px; text-align:center}
.btn.tb{min-height:36px; width:auto; min-width:42px; padding:6px 12px; flex-direction:row;
        border-radius:9px; font-size:17px}
.btn.tb.save{font-size:11px; letter-spacing:.14em; border-color:var(--amber); color:var(--amber)}

/* reconnect scrim */
#recon{position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 14px);
       transform:translateX(-50%); background:#2a2013; border:1px solid var(--amber);
       color:var(--amber); font-size:11px; letter-spacing:.12em; padding:8px 16px;
       border-radius:999px; display:none; z-index:20; box-shadow:var(--glow)}
#recon.show{display:block}

/* ---------- TUNE panel (bottom sheet) ---------- */
.pill.tunebtn{background:var(--well); color:var(--amber); border:1px solid var(--amber); cursor:pointer}
.tune{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
      background:linear-gradient(180deg,#151009,var(--void)); transform:translateY(100%);
      transition:transform .22s cubic-bezier(.2,.8,.2,1); visibility:hidden}
.tune.show{transform:translateY(0); visibility:visible}
.tune-hd{display:flex; align-items:center; justify-content:space-between; gap:8px;
         padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; border-bottom:1px solid var(--line)}
.tune-hd b{font-family:var(--sans); font-weight:800; letter-spacing:.14em; color:var(--amber); font-size:14px}
.tune-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
           padding:12px 14px calc(env(safe-area-inset-bottom) + 22px);
           display:flex; flex-direction:column; gap:13px; max-width:560px; margin:0 auto; width:100%}
.tsec{border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:10px 12px}
.tsec>.lbl{color:var(--amber); display:block; margin-bottom:6px}
.trow{display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; margin:10px 0}
.trow .name{font-size:12px; color:var(--ink)}
.trow .tval{font-size:12px; color:var(--amber); text-align:right; min-width:56px; font-variant-numeric:tabular-nums}
.trow input[type=range]{grid-column:1/-1; -webkit-appearance:none; appearance:none; height:28px;
       background:transparent; width:100%; margin:0}
.trow.dis{opacity:.4; pointer-events:none}
input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:3px; background:#0e0b07; border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; margin-top:-10px;
       border-radius:50%; background:radial-gradient(circle at 40% 35%,#ffd27a,var(--amber-hot));
       box-shadow:0 0 0 2px rgba(16,14,10,.7),0 0 10px rgba(255,140,26,.5)}
input[type=range]::-moz-range-track{height:6px; border-radius:3px; background:#0e0b07; border:1px solid var(--line)}
input[type=range]::-moz-range-thumb{width:22px; height:22px; border:none; border-radius:50%; background:var(--amber)}
.btn.tgl{min-height:34px; min-width:66px; padding:6px 14px; flex-direction:row; border-radius:9px;
         font-size:12px; letter-spacing:.1em}
.btn.tgl.on{background:linear-gradient(180deg,#4a3512,#2e2109); border-color:var(--amber); color:var(--amber)}
.btn.tsave{width:100%; min-height:44px; margin-top:4px; border-color:var(--amber); color:var(--amber);
           letter-spacing:.14em; font-size:12px}
.btn.treset{width:100%; min-height:38px; margin-top:8px; border-color:var(--line); color:var(--dim);
            letter-spacing:.1em; font-size:11px}
.btn.treset:active{color:var(--amber); border-color:var(--amber)}
.btn.tlink{width:100%; min-height:44px; margin-top:6px; border-color:var(--amber); color:var(--amber);
           letter-spacing:.14em; font-size:12px; text-decoration:none}
.btn.tb.reset{font-size:15px; min-width:42px; color:var(--dim); border-color:var(--line)}
.btn.tb.reset:active{color:var(--amber); border-color:var(--amber)}
.camwrap{position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#000;
         aspect-ratio:1/1; max-width:300px; margin:0 auto 8px; width:100%; display:flex;
         align-items:center; justify-content:center}
#camView{width:100%; height:100%; object-fit:contain; display:block}
.camstat{position:absolute; top:6px; left:8px; font-size:9.5px; letter-spacing:.12em; color:var(--amber);
         background:rgba(16,14,10,.6); padding:2px 7px; border-radius:6px}
.camstat.err{color:var(--alarm)}
.thint{font-size:10.5px; color:var(--dim); line-height:1.45; margin-top:2px}
/* tappable per-control help (ⓘ) */
.tap{cursor:pointer}
.ic{font-style:normal; text-transform:none; font-size:10px; color:var(--dim); border:1px solid var(--line);
    border-radius:50%; width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center;
    line-height:1; vertical-align:middle}
.open .ic{color:var(--amber); border-color:var(--amber)}
.thelp{grid-column:1/-1; font-size:10.5px; line-height:1.5; color:var(--dim); background:var(--well);
       border:1px solid var(--line); border-left:2px solid var(--amber); border-radius:8px; padding:7px 9px; margin-top:5px}
.thelp.hidden{display:none}
.thelp b{color:var(--amber); font-weight:400}

/* ---------- status strip + fall actions (main screen) ---------- */
#strip{display:flex; gap:8px; align-items:stretch; flex:0 0 auto}
#strip.hidden{display:none}
.chip{-webkit-appearance:none; appearance:none; font-family:var(--mono); cursor:pointer;
      display:flex; align-items:center; gap:8px; min-height:38px; padding:5px 11px; min-width:0;
      background:var(--panel); border:1px solid var(--line); border-radius:11px; color:var(--ink)}
.chip:active{border-color:var(--amber)}
.chip:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.chip.pol{flex:1; justify-content:space-between}
.chip.pol b{font-weight:400; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chip.pol i{font-style:normal; color:var(--amber); font-size:11px; flex:0 0 auto}
.chip.busy{border-color:var(--amber)} .chip.busy b{color:var(--amber)}
.chip.mark{flex:0 0 auto; color:var(--dim); font-size:11px; letter-spacing:.12em}
.chip.mark .rd{width:9px; height:9px; border-radius:50%; background:var(--alarm); box-shadow:0 0 8px rgba(255,75,58,.6)}
.chip.mark.done{border-color:var(--ok); color:var(--ok)} .chip.mark.done .rd{background:var(--ok); box-shadow:none}
#fallbar{display:none; gap:8px; flex:0 0 auto}
#fallbar.show{display:grid; grid-template-columns:1fr 1fr}
#fallbar.one{grid-template-columns:1fr}
.btn.act{min-height:50px; flex-direction:row; gap:8px; font-family:var(--sans); font-weight:800;
         letter-spacing:.12em; font-size:13px; border-color:var(--amber); color:var(--amber)}
.btn.act.go{background:linear-gradient(180deg,var(--amber),var(--amber-hot)); color:var(--void); border-color:var(--amber)}
.btn.act.stop{border-color:var(--alarm); color:#ffd9d2}
.btn.act[disabled]{opacity:.4; pointer-events:none}
#note{flex:0 0 auto; font-size:11.5px; line-height:1.4; color:var(--ink); text-align:center;
      padding:7px 10px; border:1px solid var(--line); border-left:2px solid var(--amber);
      border-radius:9px; background:var(--well); display:none}
#note.show{display:block}
/* short or narrow phones: smaller sticks, and the controls may scroll as a last resort */
#controls{overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none}
#controls::-webkit-scrollbar{display:none}
@media (max-height:760px){ .stick{max-width:150px} .btn{min-height:42px} #controls{gap:8px} }
@media (max-height:680px){ .stick{max-width:124px} .btn{min-height:38px} .btn.act{min-height:44px}
  .att{width:62px; height:62px} #tele{padding:8px 10px} }
@media (max-width:375px){ .brand .bt b{font-size:12px; white-space:nowrap} .brand svg{width:24px}
  .pill{padding:6px 9px; font-size:10.5px} .conn{font-size:9px} }
#banner.busy{background:linear-gradient(90deg,#2b2412,#3a2f12); color:var(--amber); border:1px solid var(--amber)}

/* ---------- TUNE tabs ---------- */
.tabs{display:flex; gap:6px; padding:9px 14px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      border-bottom:1px solid var(--line); scrollbar-width:none; flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{-webkit-appearance:none; appearance:none; flex:1 0 auto; min-height:36px; padding:6px 14px;
     font-family:var(--sans); font-weight:700; font-size:12.5px; letter-spacing:.04em; cursor:pointer;
     color:var(--dim); background:transparent; border:1px solid var(--line); border-radius:999px}
.tab.on{color:var(--void); background:var(--amber); border-color:var(--amber)}
.tab:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.tab .pip{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--alarm); margin-left:6px; vertical-align:middle}

/* option cards (policy picker) */
.opt{-webkit-appearance:none; appearance:none; width:100%; text-align:left; cursor:pointer;
     font-family:var(--mono); color:var(--ink); background:var(--well); border:1px solid var(--line);
     border-radius:11px; padding:10px 11px; margin-top:8px; display:grid;
     grid-template-columns:18px 1fr auto; gap:3px 9px; align-items:center}
.opt .radio{width:16px; height:16px; border-radius:50%; border:2px solid var(--dim); grid-row:1/3; align-self:start; margin-top:1px}
.opt b{font-family:var(--sans); font-weight:700; font-size:13.5px}
.opt .tag{font-size:9.5px; letter-spacing:.12em; color:var(--dim)}
.opt .sum{grid-column:2/-1; font-size:11px; line-height:1.45; color:var(--dim)}
.opt.on{border-color:var(--amber); background:linear-gradient(180deg,#33260d,#241b0a)}
.opt.on .radio{border-color:var(--amber); background:radial-gradient(circle,var(--amber) 0 40%,transparent 46%)}
.opt.on .tag{color:var(--amber)}
.opt.wait{border-color:var(--amber-hot)} .opt.wait .tag{color:var(--amber-hot)}
.opt.bad{opacity:.5; pointer-events:none} .opt.bad .sum{color:#ffb3aa}
.opt:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

/* segmented control */
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:0; margin:8px 0 4px;
     border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{-webkit-appearance:none; appearance:none; min-height:40px; border:0; cursor:pointer;
     background:var(--well); color:var(--dim); font-family:var(--sans); font-weight:700; font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--amber); color:var(--void)}
.seg button:focus-visible{outline:2px solid var(--ink); outline-offset:-3px}

/* tilt gauge: how close the duck comes to the fall thresholds */
.gauge{position:relative; height:26px; margin:14px 0 20px; border-radius:6px; background:#0e0b07; border:1px solid var(--line)}
.gauge .now{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:5px 0 0 5px;
            background:linear-gradient(90deg,#6b4a12,var(--amber)); transition:width .2s linear}
.gauge .peak{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); left:0; transition:left .2s}
.gauge .mk{position:absolute; top:0; bottom:0; width:0; border-left:1.5px dashed var(--alarm)}
.gauge .mk span{position:absolute; top:100%; left:0; transform:translateX(-50%); margin-top:3px;
                font-size:9px; color:var(--dim); white-space:nowrap}
.gauge .mk.soft{border-left-color:var(--dim)}
.kv{display:grid; grid-template-columns:1fr auto; gap:6px 10px; font-size:12px; margin:8px 0 2px}
.kv span{color:var(--dim)} .kv b{font-weight:400; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums}
.kv b.warn{color:var(--amber-hot)} .kv b.bad{color:var(--alarm)} .kv b.good{color:var(--ok)}

/* per-servo voltage */
.volts{display:grid; grid-template-columns:auto 1fr auto; gap:5px 9px; align-items:center; font-size:11px; margin-top:8px}
.volts .nm{color:var(--dim)} .volts .v{color:var(--ink); font-variant-numeric:tabular-nums}
.volts .bar{height:7px; border-radius:4px; background:#0e0b07; border:1px solid var(--line); overflow:hidden}
.volts .bar i{display:block; height:100%; background:var(--amber)}
.volts .bar.low i{background:var(--alarm)} .volts .v.low{color:var(--alarm)} .volts .nm.low{color:#ffb3aa}
.volts .grp{grid-column:1/-1; font-size:9.5px; letter-spacing:.16em; color:var(--amber); margin-top:6px}

/* recordings */
.logs{margin-top:8px; display:flex; flex-direction:column; gap:6px}
.log{display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; padding:8px 10px;
     border:1px solid var(--line); border-radius:9px; background:var(--well); color:var(--ink); text-decoration:none}
.log b{font-weight:400; font-size:12px} .log span{font-size:10px; color:var(--dim)}
.log i{font-style:normal; color:var(--amber); font-size:11px; grid-row:1/3; grid-column:2}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
.btn.tbtn{min-height:44px; flex-direction:row; gap:8px; font-size:12px; letter-spacing:.1em; border-color:var(--amber); color:var(--amber)}
.btn.tbtn.rec{border-color:var(--alarm); color:#ffcfc7}
.btn.tbtn[disabled]{opacity:.4; pointer-events:none}
details.more{margin-top:6px} details.more summary{list-style:none; cursor:pointer; font-size:11.5px; color:var(--amber);
     padding:9px 0 3px; display:flex; align-items:center; gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+"; display:inline-flex; width:16px; height:16px; align-items:center; justify-content:center;
     border:1px solid var(--amber); border-radius:50%; font-size:12px; line-height:1}
details.more[open] summary::before{content:"−"}
.tsec .sub{font-size:11px; color:var(--dim); line-height:1.45; margin:0 0 4px}
.steps{margin:6px 0 0; padding-left:18px; font-size:11.5px; line-height:1.6; color:var(--dim)}
.steps b{color:var(--ink); font-weight:400}
</style>

<script>
"use strict";
/* ---------- tunables (top-of-file) ---------- */
const POLL_MS=250;          // /api/state poll — ~4 Hz
const COMMAND_MS=100;       // /api/command while a stick is held — ~10 Hz
const TRIM_STEP=0.002;      // rad per IMU-trim +/- press (matches the gamepad step)
const CONN_TIMEOUT_MS=1000; // no state in this long -> "reconnecting"
const RECORD_HOLD_MS=3000;  // DPAD-left hold-to-record visual ring
const FETCH_TIMEOUT_MS=1500;

/* ---------- tiny helpers ---------- */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}}
async function post(path,body){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),FETCH_TIMEOUT_MS);
  try{ await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify(body),signal:c.signal,keepalive:true}); }
  catch(_){/* stay responsive; poll watchdog owns the link indicator */}
  finally{ clearTimeout(t); }
}

/* ---------- shared command vector (Xbox-stick convention) ---------- */
const cmd={l_x:0,l_y:0,r_x:0,r_y:0,left_trigger:0,right_trigger:0};
const engaged=new Set();          // which controls are currently touched
let wasActive=false;
setInterval(()=>{
  const active=engaged.size>0;
  if(active){ post("/api/command",Object.assign({active:true},round(cmd))); }
  else if(wasActive){ post("/api/command",{active:false}); }
  wasActive=active;
},COMMAND_MS);
function round(o){const r={};for(const k in o)r[k]=Math.round(o[k]*1000)/1000;return r;}

/* ---------- virtual joystick ---------- */
function makeStick(el,{horizontal=false,source,onChange,fmt}){
  const knob=el.querySelector(".knob"), read=el.querySelector(".read");
  let pid=null;
  const half=()=>el.clientWidth/2, kr=()=>knob.clientWidth/2;
  function place(dx,dy,x,y){ knob.style.transform=`translate(${dx}px,${dy}px)`;
    if(read)read.textContent=fmt?fmt(x,y):""; onChange(x,y); }
  function fromEvent(e){
    const r=el.getBoundingClientRect();
    let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
    if(horizontal) dy=0;
    const max=half()-kr(), mag=Math.hypot(dx,dy);
    if(mag>max && mag>0){ dx=dx/mag*max; dy=dy/mag*max; }
    place(dx,dy, clamp(dx/max,-1,1), clamp(-dy/max,-1,1));
  }
  el.addEventListener("pointerdown",e=>{ if(pid!==null)return;
    pid=e.pointerId; el.setPointerCapture(pid); el.classList.add("on");
    engaged.add(source); buzz(6); fromEvent(e); e.preventDefault(); },{passive:false});
  el.addEventListener("pointermove",e=>{ if(e.pointerId===pid) fromEvent(e); });
  const end=e=>{ if(e.pointerId!==pid)return;
    try{el.releasePointerCapture(pid)}catch(_){}
    pid=null; el.classList.remove("on"); engaged.delete(source);
    place(0,0,0,0); };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
  return {reset(){pid=null; el.classList.remove("on"); engaged.delete(source); place(0,0,0,0);}};
}
const stickL=makeStick($("stickL"),{source:"L",
  onChange:(x,y)=>{cmd.l_x=x; cmd.l_y=y;}, fmt:(x,y)=>`${x>=0?"+":""}${x.toFixed(2)} ${y>=0?"+":""}${y.toFixed(2)}`});
const stickR=makeStick($("stickR"),{source:"R",horizontal:true,
  onChange:(x)=>{cmd.r_x=x;}, fmt:x=>`${x>=0?"+":""}${x.toFixed(2)}`});

/* ---------- antenna trigger sliders (0..1) ---------- */
function makeSlider(el,valEl,source,set){
  const fill=el.querySelector(".fill"), grip=el.querySelector(".grip");
  let pid=null;
  function apply(v){ v=clamp(v,0,1); fill.style.width=(v*100)+"%";
    grip.style.left=(v*100)+"%"; valEl.textContent=Math.round(v*100);
    set(v); }
  function fromEvent(e){ const r=el.getBoundingClientRect(); apply((e.clientX-r.left)/r.width); }
  el.addEventListener("pointerdown",e=>{ if(pid!==null)return;
    pid=e.pointerId; el.setPointerCapture(pid); engaged.add(source); fromEvent(e); e.preventDefault(); },{passive:false});
  el.addEventListener("pointermove",e=>{ if(e.pointerId===pid) fromEvent(e); });
  const end=e=>{ if(e.pointerId!==pid)return; try{el.releasePointerCapture(pid)}catch(_){}
    pid=null; engaged.delete(source); apply(0); };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
  apply(0);
}
makeSlider($("antL"),$("antLv"),"tL",v=>cmd.left_trigger=v);
makeSlider($("antR"),$("antRv"),"tR",v=>cmd.right_trigger=v);

/* ---------- buttons ---------- */
function wireTap(btn,name){
  btn.addEventListener("click",()=>{ post("/api/button",{button:name,action:"press"});
    buzz(10); btn.classList.add("press"); setTimeout(()=>btn.classList.remove("press"),90); });
}
function wireHold(btn,name,ring){
  let raf=0, start=0;
  const down=e=>{ btn.setPointerCapture&&btn.setPointerCapture(e.pointerId);
    btn.classList.add("down"); post("/api/button",{button:name,action:"down"}); buzz(12);
    if(ring){ btn.classList.add("holding"); start=performance.now();
      const step=()=>{ const p=Math.min((performance.now()-start)/RECORD_HOLD_MS,1);
        btn.style.setProperty("--p",p); if(p<1) raf=requestAnimationFrame(step); };
      raf=requestAnimationFrame(step); } };
  const up=()=>{ if(!btn.classList.contains("down"))return;
    btn.classList.remove("down"); post("/api/button",{button:name,action:"up"});
    if(ring){ cancelAnimationFrame(raf); btn.classList.remove("holding"); btn.style.setProperty("--p",0); } };
  btn.addEventListener("pointerdown",e=>{e.preventDefault();down(e)},{passive:false});
  btn.addEventListener("pointerup",up); btn.addEventListener("pointercancel",up);
  btn.addEventListener("pointerleave",up);
}

/* per-mode control layouts. Returns the pads + lb markup and wires handlers. */
function renderControls(mode){
  const pads=$("pads"), lb=$("lbRow");
  if(mode==="head_puppet"){
    pads.innerHTML=`
      <div class="pad face">
        <button class="btn b-x" id="btnX"><span class="g">X</span><span class="l">SCAN</span></button>
        <button class="btn b-b" id="btnB"><span class="g">B</span><span class="l">SOUND</span></button>
      </div>
      <div class="pad dpad">
        <button class="btn d-up" id="btnUp"><span class="g">◎</span><span class="l">TRACK</span></button>
        <button class="btn d-lt" id="btnLeft"><span class="l">REC</span><span class="g">●</span><div class="ring"></div></button>
        <div class="d-mid"><b>HEAD</b><span>PUPPET</span></div>
        <button class="btn d-rt" id="btnRight"><span class="g">▶</span><span class="l">PLAY</span></button>
      </div>`;
    lb.innerHTML="";
    wireTap($("btnX"),"X"); wireTap($("btnB"),"B"); wireTap($("btnUp"),"dpad_up");
    wireTap($("btnRight"),"dpad_right"); wireHold($("btnLeft"),"dpad_left",true);
  }else{
    pads.innerHTML=`
      <div class="pad face">
        <button class="btn b-y" id="btnY"><span class="g">Y</span><span class="l">HEAD</span></button>
        <button class="btn b-x" id="btnX"><span class="g">X</span><span class="l">SCAN</span></button>
        <button class="btn b-b" id="btnB"><span class="g">B</span><span class="l">SOUND</span></button>
        <button class="btn b-a" id="btnA"><span class="g">A</span><span class="l">PAUSE</span></button>
      </div>
      <div class="pad dpad">
        <button class="btn d-up" id="btnUp"><span class="g">▲</span><span class="l">GAIT+</span></button>
        <button class="btn d-lt" id="btnLeft"><span class="l">REC</span><span class="g">●</span><div class="ring"></div></button>
        <div class="d-mid"><b id="gait">+0.00</b><span>GAIT</span></div>
        <button class="btn d-rt" id="btnRight"><span class="g">▶</span><span class="l">PLAY</span></button>
        <button class="btn d-dn" id="btnDown"><span class="g">▼</span><span class="l">GAIT−</span></button>
      </div>`;
    lb.innerHTML=`<button class="btn lb" id="btnLB"><span class="g">LB</span><span class="l">HOLD TO SPRINT</span></button>`;
    wireTap($("btnA"),"A"); wireTap($("btnX"),"X"); wireTap($("btnB"),"B"); wireTap($("btnY"),"Y");
    wireTap($("btnUp"),"dpad_up"); wireTap($("btnDown"),"dpad_down");
    wireTap($("btnRight"),"dpad_right");
    wireHold($("btnLeft"),"dpad_left",true); wireHold($("btnLB"),"LB",false);
  }
  $("capL").textContent = mode==="head_puppet" ? "YAW · PITCH" : "DRIVE";
  $("capR").textContent = mode==="head_puppet" ? "ROLL" : "TURN";
}

/* ---------- state / render ---------- */
let curMode=null, lastOk=0, lastState=null, tuneOpen=false;
const net={connected:false};

function poll(){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),FETCH_TIMEOUT_MS);
  fetch("/api/state",{signal:c.signal}).then(r=>r.json()).then(s=>{
    lastOk=performance.now(); render(s);
  }).catch(()=>{}).finally(()=>clearTimeout(t));
}
/* IMU-trim card (settings → Walk): nudge +/- (radians) and Save. Wired per render. */
function wireTrim(){
  if(!$("trimPitchUp")) return;
  const nudge=(axis,delta)=>{ post("/api/trim",{axis,delta}); buzz(8); };
  $("trimPitchUp").addEventListener("click",()=>nudge("pitch",TRIM_STEP));
  $("trimPitchDn").addEventListener("click",()=>nudge("pitch",-TRIM_STEP));
  $("trimRollUp").addEventListener("click",()=>nudge("roll",TRIM_STEP));
  $("trimRollDn").addEventListener("click",()=>nudge("roll",-TRIM_STEP));
  $("trimSave").addEventListener("click",()=>{ post("/api/trim",{action:"save"}); buzz(20); });
  $("trimReset").addEventListener("click",()=>{ post("/api/setting",{group:"imu_trim",action:"reset"}); buzz(20); });
  // tappable pitch/roll explanations
  const tHelp=(lblId,hlpId)=>{ const l=$(lblId),h=$(hlpId); if(!l||!h)return;
    l.addEventListener("click",()=>{ const hid=h.classList.toggle("hidden"); l.classList.toggle("open",!hid); buzz(5); }); };
  tHelp("trimPitchLbl","hlp_pitch"); tHelp("trimRollLbl","hlp_roll");
}
setInterval(poll,POLL_MS); poll();

/* connection watchdog — drives the link light independent of the poll */
setInterval(()=>{
  const live=(performance.now()-lastOk)<CONN_TIMEOUT_MS;
  if(live===net.connected) return;
  net.connected=live;
  $("conn").classList.toggle("live",live);
  $("connTxt").textContent=live?"LINK":"NO LINK";
  $("controls").classList.toggle("off",!live);
  $("recon").classList.toggle("show",!live);
  $("att").classList.toggle("stale",!live);
},250);

function setBanner(s){
  const b=$("banner");
  let cls="", txt="";
  const act=s.activity, BUSY={getup:"GETTING UP",reflex:"SOFT LANDING",recover:"BACK TO STANCE",
    balance:"BALANCING",switch:"SWITCHING POLICY"};
  if(BUSY[act]){cls="busy"; txt=BUSY[act];}
  else if(s.fallen){cls="fall"; txt="⚠ FALLEN";}
  else if(s.paused){cls="pause"; txt=act==="stance"?"❙❙ HOLDING STANCE":"❙❙ PAUSED";}
  b.className = cls?("show "+cls):"";
  b.textContent=txt;
  // one line from the duck about what just happened or what to do next
  const n=$("note"); n.textContent=s.message||""; n.classList.toggle("show",!!s.message);
  // after a fall: the two things you can do, as buttons
  const walk=s.mode!=="head_puppet", gu=s.getup||{}, fb=$("fallbar"), g=$("getupBtn"), r=$("resumeBtn");
  const running=act==="getup", show=walk&&(running||(s.fallen&&!BUSY[act]));
  fb.classList.toggle("show",show);
  if(show){
    const offer=running||!!gu.enabled;
    g.style.display=offer?"":"none"; r.style.display=running?"none":"";
    fb.classList.toggle("one",running||!offer);
    g.textContent=running?"■ STOP":(gu.ready?"GET UP":"GET UP · LOADING");
    g.classList.toggle("stop",running); g.classList.toggle("go",!running);
    g.disabled=!running&&!gu.ready;
    r.textContent="RESUME";
  }
  // policy chip + recorder mark
  const st=$("strip"), p=s.policy;
  st.classList.toggle("hidden",!walk||!p);
  if(walk&&p){ const cur=(p.slots||[]).find(x=>x.id===p.active), chip=$("polChip");
    const busy=p.state==="loading"||p.state==="ready";
    $("polName").textContent=busy?"Switching policy…":(cur?cur.name:p.active);
    chip.classList.toggle("busy",busy); }
}

function render(s){
  lastState=s;
  // mode + panel
  if(s.mode!==curMode){ curMode=s.mode; renderControls(s.mode);
    const p=$("mode"); p.textContent = s.mode==="head_puppet"?"HEAD":"WALK";
    p.classList.toggle("head",s.mode==="head_puppet");
    if(tuneOpen) openTune();   // rebuild the tune panel for the new mode
  }
  updateTuneLive(s);

  setBanner(s);

  // attitude horizon (the signature)
  const att=$("att"), disc=$("attDisc");
  att.classList.toggle("fallen",!!s.fallen);
  if(s.imu && s.imu.pitch!=null){
    const pitch=clamp(s.imu.pitch,-45,45), roll=clamp(s.imu.roll,-70,70);
    disc.style.transform=`rotate(${-roll}deg) translateY(${pitch*0.7}px)`;
    $("pit").textContent=(s.imu.pitch>=0?"+":"")+s.imu.pitch.toFixed(0)+"°";
    $("rol").textContent=(s.imu.roll>=0?"+":"")+s.imu.roll.toFixed(0)+"°";
    att.classList.remove("stale");
  }else{ disc.style.transform="rotate(0) translateY(0)";
    $("pit").textContent="—"; $("rol").textContent="—"; if(net.connected)att.classList.add("stale"); }

  // battery
  const b=s.battery||{}, body=$("battBody");
  const pct = b.percent!=null ? clamp(b.percent,0,100) : null;
  $("battFill").style.width=(pct==null?0:pct)+"%";
  body.classList.toggle("warn", pct!=null && pct<=35 && pct>15);
  body.classList.toggle("crit", pct!=null && pct<=15);
  body.classList.toggle("chg", !!b.charging);
  $("battV").textContent = b.voltage!=null ? b.voltage.toFixed(1) : "--.-";
  $("battP").textContent = pct!=null ? pct : "--";

  // readouts
  $("hz").textContent   = s.loop_hz!=null ? s.loop_hz.toFixed(1) : "--";
  $("temp").textContent = s.temp_c!=null ? s.temp_c.toFixed(0) : "--";
  $("up").textContent   = s.uptime_s!=null ? Math.round(s.uptime_s) : "--";
  const rec=s.recording||{state:"idle"}, re=$("rec");
  re.textContent = rec.state==="recording" ? `REC ${(rec.seconds||0).toFixed(1)}s`
                 : rec.state==="playing" ? "PLAY" : "idle";
  re.className="rec"+(rec.state==="recording"?" on":rec.state==="playing"?" play":"");

  // live flags + feature gating
  const f=s.flags||{}, feat=s.features||{};
  setActive("btnX", f.projector_on); setFeat("btnX", feat.projector!==false);
  setFeat("btnB", feat.speaker!==false);
  setActive("btnY", f.head_control);
  setActive("btnLB", f.sprint);
  setActive("btnA", s.paused);
  setRec("btnLeft", rec.state==="recording");
  setPlay("btnRight", rec.state==="playing");
  if(s.mode==="head_puppet") setActive("btnUp", f.tracking);
  const g=$("gait"); if(g && s.gait_offset!=null) g.textContent=(s.gait_offset>=0?"+":"")+s.gait_offset.toFixed(2);
  $("ant").classList.toggle("hidden", feat.antennas===false);

  // stability governor: only show the readout when it's enabled; warn while it throttles
  const gov=s.governor, gvRead=$("govRead");
  if(gvRead){
    gvRead.classList.toggle("hidden", !(gov && gov.enabled));
    if(gov && gov.enabled){
      $("gov").textContent=(gov.scale!=null?gov.scale:1).toFixed(2);
      gvRead.classList.toggle("warn", (gov.severity||0)>0.05);
    }
  }

}
function setActive(id,on){ const e=$(id); if(e) e.classList.toggle("active",!!on); }
function setFeat(id,on){ const e=$(id); if(e){ e.classList.toggle("disabled",!on); if(!on) e.setAttribute("aria-disabled","true"); } }
function setRec(id,on){ const e=$(id); if(e) e.classList.toggle("rec",!!on); }
function setPlay(id,on){ const e=$(id); if(e) e.classList.toggle("play",!!on); }

function fmtVal(spec,v){ const d=spec.dec!=null?spec.dec:decs(spec.step);
  let s=Number(v).toFixed(d); if(spec.min<0&&v>=0)s="+"+s; return s+(spec.unit?(" "+spec.unit):""); }
function fmtValFromInput(inp,v){ const d=+inp.dataset.dec,u=inp.dataset.unit,sign=inp.dataset.sign==="1";
  let s=Number(v).toFixed(d); if(sign&&v>=0)s="+"+s; return s+(u?(" "+u):""); }

function nameCell(spec){ return `<span class="name${spec.help?" tap":""}">${spec.name}${spec.help?' <i class="ic">i</i>':""}</span>`; }
function helpCell(spec){ return spec.help?`<div class="thelp hidden">${spec.help}</div>`:""; }
function sliderRow(group,spec,val){ const id=`tc_${group}_${spec.k}`,d=spec.dec!=null?spec.dec:decs(spec.step);
  return `<div class="trow">${nameCell(spec)}
    <span class="tval" id="${id}_v">${fmtVal(spec,val)}</span>
    <input type="range" id="${id}" data-group="${group}" data-key="${spec.k}" data-unit="${spec.unit||""}"
      data-dec="${d}" data-sign="${spec.min<0?1:0}" min="${spec.min}" max="${spec.max}" step="${spec.step}" value="${val}">
    ${helpCell(spec)}</div>`; }
function toggleRow(group,spec,on){ const id=`tc_${group}_${spec.k}`;
  return `<div class="trow tog">${nameCell(spec)}
    <button class="btn tgl${on?" on":""}" id="${id}" data-group="${group}" data-key="${spec.k}" data-on="${on?1:0}">${on?"ON":"OFF"}</button>
    ${helpCell(spec)}</div>`; }
function rows(group,specs,read){ return specs.map(spec=>{ const v=read(spec.k);
  return spec.type==="tgl"?toggleRow(group,spec,!!v):sliderRow(group,spec,v); }).join(""); }

function readWalk(k,s){ const wp=s.walk_params||{}, gov=wp.governor||{}, sl=s.command_slew||{};
  if(k==="action_scale") return wp.action_scale_target!=null?wp.action_scale_target:(wp.action_scale!=null?wp.action_scale:0.25);
  if(k.indexOf("governor_")===0){ const gk=k.slice(9);
    if(gk==="enabled") return !!gov.enabled; return gov[gk]!=null?gov[gk]:0; }
  if(k.indexOf("slew_")===0){ const sk=k.slice(5); return sl[sk]!=null?sl[sk]:(sk==="enabled"?false:0); }
  return wp[k]!=null?wp[k]:0;
}

  let html=`<div class="tsec"><span class="lbl">Camera</span>
    <div class="camwrap"><span class="camstat" id="camStat">…</span><img id="camView" alt="camera preview"></div>
    <div class="thint">${avail?"Live view — confirm the camera works, then tune it for the room. Turn Auto exposure off to set exposure &amp; gain by hand.":"No camera detected. Enable <b>camera</b> in duck_config and connect the picam, then restart."}</div>`;
  if(avail){
    html+=rows("camera",CAM_CONTROLS,k=>cc[k]!=null?cc[k]:CAM_DEFAULTS[k]);
    html+=`<button class="btn tsave" data-save="camera">SAVE CAMERA TO DUCK</button>
      <button class="btn treset" data-reset="camera">↺ RESET CAMERA TO DEFAULTS</button>`;
  }
  return html+`</div>`;
}

const TRIM_CARD=`<div class="trim" id="trim">
      <span class="lbl">IMU trim</span>
      <div class="trim-ax"><span class="lbl tap" id="trimPitchLbl">pitch <i class="ic">i</i></span>
        <button class="btn tb" id="trimPitchDn" aria-label="pitch down">−</button>
        <b class="num" id="trimPitch">--</b><span class="lbl">°</span>
        <button class="btn tb" id="trimPitchUp" aria-label="pitch up">+</button></div>
      <div class="trim-ax"><span class="lbl tap" id="trimRollLbl">roll <i class="ic">i</i></span>
        <button class="btn tb" id="trimRollDn" aria-label="roll down">−</button>
        <b class="num" id="trimRoll">--</b><span class="lbl">°</span>
        <button class="btn tb" id="trimRollUp" aria-label="roll up">+</button></div>
      <button class="btn tb reset" id="trimReset" aria-label="reset trim to zero">↺</button>
      <button class="btn tb save" id="trimSave">SAVE</button>
      <div class="thelp hidden" id="hlp_pitch" style="flex-basis:100%">Cancels a forward/back lean the IMU reads at rest (radians). Nudge <b>+</b> if the duck tips/falls backward, <b>−</b> if it tips forward — until it stands square. Then validate by walking; if it walks worse, set it back.</div>
      <div class="thelp hidden" id="hlp_roll" style="flex-basis:100%">Cancels a left/right lean the IMU reads at rest (radians). Nudge <b>+</b> if it leans/falls to one side, <b>−</b> for the other. Small steps; check by walking. Roll should sit near 0 on a symmetric duck.</div>
    </div>`;
const PANES={policy:panePolicy,walk:paneWalk,safety:paneSafety,health:paneHealth,ears:paneEars,camera:paneCamera};
const TAB_NAMES={policy:"Policy",walk:"Walk",safety:"Safety",health:"Health",ears:"Ears",camera:"Camera"};
let curTab={walk:"policy",head_puppet:"camera"};
try{ const t=JSON.parse(sessionStorage.getItem("duckTab")||"null"); if(t&&t.walk&&t.head_puppet) curTab=t; }catch(_){}
function tabsFor(mode,s){
  const ears=((s.features||{}).antennas)!==false;
  const t = mode==="head_puppet" ? ["camera"] : ["policy","walk","safety","health"];
  if(ears) t.push("ears"); return t;
}

function renderTune(mode){
  const s=lastState||{}, body=$("tuneBody"), tabs=tabsFor(mode,s);
  if(tabs.indexOf(curTab[mode])<0) curTab[mode]=tabs[0];
  const tab=curTab[mode];
  $("tuneTitle").textContent = mode==="head_puppet"?"HEAD SETTINGS":"DUCK SETTINGS";
  $("tuneTabs").innerHTML=tabs.map(t=>`<button class="tab${t===tab?" on":""}" role="tab" aria-selected="${t===tab}" data-tab="${t}">${TAB_NAMES[t]}</button>`).join("");
  $("tuneTabs").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
    curTab[mode]=b.dataset.tab; try{sessionStorage.setItem("duckTab",JSON.stringify(curTab))}catch(_){}
    buzz(6); stopCam(); renderTune(mode); body.scrollTop=0;
    if(curTab[mode]==="camera" && ((lastState||{}).camera||{}).available) startCam(); }));
  body.innerHTML=PANES[tab](s);
  polSig="";
  wireTune();
  updateTuneLive(s);
  if(tab==="health") loadLogs();
}

function applyCamDisable(){ const ae=$("tc_camera_ae"); if(!ae)return; const on=ae.dataset.on==="1";
  ["exposure","gain"].forEach(k=>{ const el=$("tc_camera_"+k); if(el)el.closest(".trow").classList.toggle("dis",on); }); }

function flash(btn,text){ const t=btn.textContent; btn.textContent=text; setTimeout(()=>{btn.textContent=t;},1200); }

function wireTune(){
  const body=$("tuneBody");
  body.querySelectorAll('input[type=range]').forEach(inp=>{
    let last=0;
    const send=()=>post("/api/setting",{group:inp.dataset.group,key:inp.dataset.key,value:parseFloat(inp.value)});
    inp.addEventListener('input',()=>{ const v=parseFloat(inp.value); const vs=$(inp.id+"_v");
      if(vs)vs.textContent=fmtValFromInput(inp,v);
      const t=performance.now(); if(t-last>=100){last=t; send();} });
    inp.addEventListener('change',send);
  });
  body.querySelectorAll('.btn.tgl').forEach(btn=>{
    btn.addEventListener('click',()=>{ const on=btn.dataset.on!=="1"; btn.dataset.on=on?"1":"0";
      btn.classList.toggle('on',on); btn.textContent=on?"ON":"OFF"; buzz(8);
      post("/api/setting",{group:btn.dataset.group,key:btn.dataset.key,value:on});
      if(btn.dataset.group==="camera"&&btn.dataset.key==="ae") applyCamDisable(); });
  });
  body.querySelectorAll('.seg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); buzz(8);
      post("/api/setting",{group:seg.dataset.group,key:seg.dataset.key,value:b.dataset.val}); }));
  });
  body.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('click',()=>{ const [group,key]=b.dataset.act.split(":");
      post("/api/setting",{group,key,value:true}); buzz(14); flash(b,"SENT ✓"); });
  });
  body.querySelectorAll('[data-opt]').forEach(b=>{
    b.addEventListener('click',()=>{ const [group,key,value]=b.dataset.opt.split(":");
      post("/api/setting",{group,key,value}); buzz(10);
      b.parentElement.querySelectorAll('[data-opt]').forEach(x=>{ const on=x===b; x.classList.toggle("on",on);
        const tag=x.querySelector(".tag"); if(tag) tag.textContent=on?"SELECTED":""; }); });
  });
  body.querySelectorAll('[data-save]').forEach(b=>{
    b.addEventListener('click',()=>{ post("/api/setting",{group:b.dataset.save,action:"save"}); buzz(20); flash(b,"SAVED ✓"); });
  });
  body.querySelectorAll('[data-reset]').forEach(b=>{
    b.addEventListener('click',()=>{ post("/api/setting",{group:b.dataset.reset,action:"reset"}); buzz(20);
      b.textContent="↺ RESETTING…";
      // give the loop a couple of ticks to apply, then rebuild the pane from the new
      // state; if it's the camera pane, restart the live preview it just rebuilt.
      setTimeout(()=>{ if(tuneOpen){ renderTune(curMode);
        const cam=(lastState&&lastState.camera)||{};
        if(curMode==="head_puppet" && curTab.head_puppet==="camera" && cam.available) startCam(); } }, 500); });
  });
  // tap a control name (ⓘ) to reveal/hide its explanation
  body.querySelectorAll('.trow .name.tap').forEach(n=>{
    const help=n.parentElement.querySelector('.thelp'); if(!help) return;
    n.addEventListener('click',()=>{ const hid=help.classList.toggle('hidden'); n.classList.toggle('open',!hid); buzz(5); });
  });
  const take=$("takeBtn");
  if(take) take.addEventListener("click",()=>{ const on=!take.classList.contains("rec");
    post("/api/setting",{group:"recorder",key:"take",value:on}); buzz(14);
    if(!on) setTimeout(loadLogs,1500); });
  const lr=$("logRefresh"); if(lr) lr.addEventListener("click",()=>{ buzz(6); loadLogs(); });
  wireTrim();
  applyCamDisable();
}

/* recordings list: fetched when the Health tab opens (not polled) */
function logLabel(name){ const m=/^(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)(\d\d)_(.+)\.npz$/.exec(name);
  return m?{what:m[7].replace(/_/g," "),when:`${m[3]}.${m[2]}. ${m[4]}:${m[5]}:${m[6]}`}:{what:name,when:""}; }
function loadLogs(){ const list=$("logList"); if(!list) return;
  fetch("/api/logs").then(r=>r.json()).then(d=>{ const logs=d.logs||[];
    list.innerHTML = logs.length ? logs.slice(0,40).map(l=>{ const lb=logLabel(l.name);
      return `<a class="log" href="/api/logs/${encodeURIComponent(l.name)}" download="${esc(l.name)}">
        <b>${esc(lb.what)}</b><i>SAVE ↓</i><span>${esc(lb.when)} · ${(l.bytes/1024).toFixed(0)} kB</span></a>`; }).join("")
      : `<div class="thint">Nothing recorded yet. Tap MARK NOW, or let the duck fall once.</div>`;
  }).catch(()=>{ list.innerHTML=`<div class="thint">Could not load the list.</div>`; }); }

/* policy cards: rebuilt only when something about them changed */
let polSig="", liveActive=null;
function updatePolicy(s){ const el=$("polList"); if(!el) return;
  const p=s.policy||{}, slots=(p.slots||[]).filter(x=>x.kind==="walk");
  const sig=JSON.stringify([p.active,p.pending,p.state,p.message,slots.map(x=>[x.id,x.usable])]);
  if(sig===polSig) return; polSig=sig;
  el.innerHTML=slots.map(x=>{ const on=x.id===p.active, wait=x.id===p.pending;
    const tag = on?"RUNNING": wait?(p.state==="loading"?"LOADING…":"SWITCHING…"):"";
    const sum = x.usable ? x.summary+(x.license?` Licence: ${x.license}.`:"") : `Not usable: ${x.error}`;
    return `<button class="opt${on?" on":""}${wait?" wait":""}${x.usable?"":" bad"}" data-pol="${esc(x.id)}" aria-pressed="${on}">
      <span class="radio"></span><b>${esc(x.name)}</b><span class="tag">${tag}</span>
      <span class="sum">${esc(sum)}</span></button>`; }).join("")
    + (p.state==="error"&&p.message?`<div class="thelp" style="margin-top:8px">${esc(p.message)}</div>`:"");
  el.querySelectorAll("[data-pol]").forEach(b=>b.addEventListener("click",()=>{
    if(b.classList.contains("on")) return;
    post("/api/setting",{group:"policy",key:"active",value:b.dataset.pol}); buzz(14);
    const tag=b.querySelector(".tag"); if(tag) tag.textContent="LOADING…"; b.classList.add("wait"); }));
}

/* live values inside the open sheet; never rebuilds a pane (sliders stay put) */
const MODE_HINT={off:"Off. Only the old check runs: it pauses the duck once it has been lying for 2.5 s.",
  observe:"Observe. Falls are detected and recorded, nothing about the motion changes. Use this to check the thresholds first.",
  active:"Active. A detected fall stops the walk and softens the joints. Stand the duck up and press A to continue."};
function setTxt(id,t,cls){ const e=$(id); if(!e) return; e.textContent=t; if(cls!=null) e.className=cls; }
function updateTuneLive(s){
  if(!tuneOpen) return;
  // a policy swap changes the stride values: rebuild the Walk pane once to show them
  const act=(s.policy||{}).active;
  if(liveActive!==null && act!==liveActive && curTab[curMode||"walk"]==="walk"){ liveActive=act; renderTune(curMode||"walk"); return; }
  liveActive=act;
  updatePolicy(s);
  const sf=s.safety;
  if(sf && $("sfGauge")){
    const cfg=sf.config||{}, pct=v=>clamp(v/90*100,0,100)+"%";
    const g=$("sfGauge"); g.querySelector(".now").style.width=pct(s.tilt_deg||0);
    g.querySelector(".peak").style.left=pct(sf.peak_tilt_deg||0);
    $("sfMkMin").style.left=pct(cfg.min_tilt_deg||0); $("sfMkHard").style.left=pct(cfg.hard_deg||0);
    setTxt("sfNow",(s.tilt_deg||0).toFixed(0)+"°");
    const near=(sf.peak_tilt_deg||0)>=(cfg.min_tilt_deg||0);
    setTxt("sfPeak",(sf.peak_tilt_deg||0).toFixed(0)+"° of "+(cfg.min_tilt_deg||0).toFixed(0)+"°",near?"warn":"");
    setTxt("sfPeakPred",(sf.peak_predicted_deg||0).toFixed(0)+"° of "+(cfg.predict_deg||0).toFixed(0)+"°",
           (sf.peak_predicted_deg||0)>=(cfg.predict_deg||0)*0.8?"warn":"");
    setTxt("sfTrig",String(sf.triggers||0));
    const lt=sf.last_trigger; setTxt("sfLast",lt?`${lt.tilt}° lean, ${lt.predicted}° predicted`:"none yet");
    setTxt("sfModeHint",MODE_HINT[sf.mode]||"");
  }
  const gu=s.getup;
  if(gu && $("guState")){
    setTxt("guState", !gu.enabled?"switched off": gu.ready?"ready": (gu.note||"loading"), gu.enabled?(gu.ready?"good":"warn"):"");
    setTxt("guRef", gu.has_reference?"captured":"not captured yet", gu.has_reference?"good":"warn");
    const r=gu.run; setTxt("guRun", r?(r.phase==="run"?`running, ${r.elapsed_s} s`:(r.result||r.phase)):"none yet");
  }
  const bb=s.blackbox;
  if(bb && $("bbSaved")){
    setTxt("bbSaved", bb.enabled?String(bb.saved||0):"recorder is off");
    setTxt("bbLast", bb.error?bb.error:(bb.last_file?logLabel(bb.last_file).what:"none yet"), bb.error?"bad":"");
    const tk=$("takeBtn"); if(tk){ tk.classList.toggle("rec",!!bb.taking);
      tk.textContent = bb.taking?`■ STOP · ${(bb.take_s||0).toFixed(0)} s`:"START A TAKE"; }
  }
  const tr=s.imu_trim, DEG=180/Math.PI;
  if(tr && tr.pitch!=null && $("trimPitch")){
    setTxt("trimPitch",(tr.pitch>=0?"+":"")+(tr.pitch*DEG).toFixed(2));
    setTxt("trimRoll",(tr.roll>=0?"+":"")+(tr.roll*DEG).toFixed(2));
  }
  const lh=s.loop;
  if(lh && $("lhLate")){
    setTxt("lhLate",(lh.late_pct||0).toFixed(1)+" %", lh.late_pct>5?"bad":lh.late_pct>1?"warn":"good");
    setTxt("lhWorst",(lh.worst_ms||0).toFixed(0)+" ms", lh.worst_ms>60?"bad":lh.worst_ms>30?"warn":"");
    setTxt("lhFail",String(lh.read_failures||0), lh.read_failures>0?"warn":"");
  }
  const vl=$("voltList"), sv=s.servo_voltages;
  if(vl && sv && Object.keys(sv).length){
    const vals=Object.values(sv), top=Math.max.apply(null,vals), sig=JSON.stringify(sv);
    if(vl.dataset.sig!==sig){ vl.dataset.sig=sig;
      vl.innerHTML=JOINT_GROUPS.map(([g,js])=>`<div class="grp">${g}</div>`+js.filter(j=>sv[j]!=null).map(j=>{
        const v=sv[j], low=v<top-0.4;
        return `<span class="nm${low?" low":""}">${j.replace(/^(left|right)_/,"").replace(/_/g," ")}</span>
          <span class="bar${low?" low":""}"><i style="width:${clamp((v-5.5)/(8.6-5.5)*100,3,100)}%"></i></span>
          <span class="v${low?" low":""}">${v.toFixed(1)} V</span>`; }).join("")).join(""); }
  }
}

/* live camera preview — poll a single JPEG a few times a second (robust over the
   tiny server; encoded on demand so it costs nothing when the panel is closed). */
let camTimer=null;
function startCam(){ stopCam(); const img=$("camView"), stat=$("camStat"); if(!img)return;
  const tick=()=>{ img.src="/api/camera/frame.jpg?ts="+Date.now(); };
  img.onload=()=>{ if(stat){stat.textContent="LIVE"; stat.classList.remove("err");} camTimer=setTimeout(tick,140); };
  img.onerror=()=>{ if(stat){stat.textContent="no signal"; stat.classList.add("err");} camTimer=setTimeout(tick,1000); };
  tick(); }
function stopCam(){ if(camTimer){clearTimeout(camTimer); camTimer=null;} const img=$("camView"); if(img){img.onload=null; img.onerror=null;} }

function openTune(tab){ tuneOpen=true; stopCam(); const mode=curMode||"walk";
  if(tab) curTab[mode]=tab;
  renderTune(mode);
  const t=$("tune"); t.classList.add("show"); t.setAttribute("aria-hidden","false");
  const cam=(lastState&&lastState.camera)||{};
  if(mode==="head_puppet" && curTab[mode]==="camera" && cam.available) startCam(); }
function closeTune(){ tuneOpen=false; const t=$("tune"); t.classList.remove("show");
  t.setAttribute("aria-hidden","true"); stopCam(); }
$("tuneBtn").addEventListener("click",()=>tuneOpen?closeTune():openTune());
$("polChip").addEventListener("click",()=>{ buzz(8); openTune("policy"); });
$("markBtn").addEventListener("click",()=>{ const b=$("markBtn");
  post("/api/setting",{group:"recorder",key:"mark",value:true}); buzz(20);
  b.classList.add("done"); setTimeout(()=>b.classList.remove("done"),1500); });
$("getupBtn").addEventListener("click",()=>{ const running=(lastState||{}).activity==="getup"; buzz(20);
  post("/api/setting",{group:"getup",key:running?"abort":"start",value:true}); });
$("resumeBtn").addEventListener("click",()=>{ buzz(14); post("/api/button",{button:"A",action:"press"}); });
$("tuneClose").addEventListener("click",closeTune);

// guard against iOS rubber-band / double-tap zoom on the console
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
</script>
